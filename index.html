<style>

:root:not([data-theme=light]){color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1915;--fg:#f1ebdf;--mut:#b3a897;--card:#26221c;--ac:#d4b48a;--acf:#1c1915;--ln:#3a342b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#1c1915;--fg:#f1ebdf;--mut:#b3a897;--card:#26221c;--ac:#d4b48a;--acf:#1c1915;--ln:#3a342b;color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 'Be Vietnam Pro',system-ui,sans-serif;overflow-x:hidden}

button{cursor:pointer;background:var(--ac);color:var(--acf);border:0;padding:9px 16px;border-radius:2px}
button.g{background:transparent;color:var(--fg);border:1px solid var(--fg)}

.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--ln)}
.bar{display:flex;gap:10px;align-items:center;padding:10px 16px;max-width:1100px;margin:auto;flex-wrap:wrap}
.logo{font-size:1.4rem;letter-spacing:.12em;text-decoration:none;color:var(--fg);margin-right:auto}
#q{width:190px}

main,#adm{max-width:1100px;margin:auto;padding:24px 16px 48px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center;padding:16px 0 32px}
.hero h1{font-size:clamp(2rem,6vw,3.6rem);margin:0 0 12px}
.hero svg{width:100%;max-height:380px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--ln);display:flex;flex-direction:column}
.img{background:#efe6d6;aspect-ratio:5/6;display:flex;align-items:center;justify-content:center}
.img svg,.img img{width:100%;height:100%;object-fit:cover}
.bd{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.bd small,.mut{color:var(--mut)}.pr{font-weight:600;margin:0}
.bd p{margin:0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.bg{display:inline-block;font-size:.78rem;padding:1px 8px;border:1px solid var(--bad);color:var(--bad);width:fit-content}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chips button{background:var(--card);color:var(--fg);border:1px solid var(--ln)}.chips button.on{background:var(--ac);color:var(--acf)}
section{margin-bottom:40px}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--ln);padding:8px;text-align:left}
.sc{overflow-x:auto}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
#dr{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:50;padding:16px;overflow-y:auto;border-left:1px solid var(--ln)}
#md{position:fixed;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:90vh;overflow:auto;background:var(--bg);padding:16px;border:1px solid var(--ln)}
.ln{display:flex;gap:10px;justify-content:space-between;border-bottom:1px solid var(--ln);padding:10px 0;align-items:center}
.ln div{min-width:0}.qty{display:flex;gap:6px;align-items:center}.qty button{padding:2px 10px}
pre{white-space:pre-wrap;background:var(--card);border:1px solid var(--ln);padding:10px;font-size:.88rem;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;z-index:60;max-width:calc(100% - 32px);border-radius:2px}
.rv{border:1px solid var(--ln);background:var(--card);padding:12px}.st5{color:#b8862b}
footer{border-top:1px solid var(--ln);padding-top:20px;display:grid;gap:6px}
#adm details{border:1px solid var(--ln);margin-bottom:12px;padding:10px;background:var(--card)}
#adm label{display:block;margin:8px 0 2px;font-size:.9rem}#adm input[type=text],#adm input:not([type]),#adm textarea{width:100%}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-bottom:1px solid var(--ln);padding:8px 0}
@media(max-width:700px){.hero{grid-template-columns:1fr}#q{width:100%;order:5}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

h=`<h2>Sản phẩm</h2><div class="chips"><button class="${fc?'':'on'}" onclick="fc='';fs='';render()">Tất cả</button>${S.cats.map(c=>`<button class="${fc===c.n?'on':''}" onclick="fc='${esc(c.n)}';fs='';render()">${esc(c.n)}</button>`).join('')}</div>${subs.length?`<div class="chips">${subs.map(x=>`<button class="${fs===x?'on':''}" onclick="fs='${esc(x)}';render()">${esc(x)}</button>`).join('')}</div>`:''}${grid(l)}`}
if(tab==='cols')h='<h2>Bộ sưu tập</h2>'+S.cols.map(c=>`<section><h3>${esc(c.n)}</h3>${grid((c.ids||[]).map(P).filter(Boolean))}</section>`).join('');
if(tab==='how')h=`<h2>Cách đặt hàng</h2><ol><li><b>Chọn món:</b> chọn size rồi bấm “Thêm vào giỏ”.</li><li><b>Mở giỏ hàng:</b> kiểm tra số lượng, bấm “Tiến hành thanh toán”.</li><li><b>Điền Google Form:</b> dán nội dung đơn (đã được sao chép sẵn), điền thông tin nhận hàng và bấm Gửi.</li></ol><p>Website không có thanh toán trực tuyến. Shop sẽ gọi điện xác nhận đơn, và tồn kho được cập nhật sau khi shop xác nhận.</p>`;
if(tab==='about')h=`<h2>Về chúng tôi</h2><h3>Câu chuyện</h3><p>${esc(s.story)}</p><h3>Sứ mệnh</h3><p>${esc(s.mission)}</p><h3>Tầm nhìn</h3><p>${esc(s.vision)}</p><h3>Giá trị cốt lõi</h3><p>${esc(s.values)}</p><h2 style="margin-top:32px">Thành viên thực hiện</h2><div class="sc"><table><tr><th>STT</th><th>MSSV</th><th>Họ và tên</th><th>Vai trò</th></tr>${s.members.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.mssv)}</td><td>${esc(m.name)}</td><td>${esc(m.role)}</td></tr>`).join('')}</table></div>`;
if(tab==='rev')h=`<h2>Phản hồi khách hàng</h2>${revs(99)}`;
if(tab==='contact')h=`<h2>Liên hệ</h2>${info()}`;
$('#main').innerHTML=h+`<footer style="margin-top:40px"><b>LUNE STUDIO</b>${info()}<small class="mut">Chính sách: shop gọi xác nhận đơn trước khi giao. Website chỉ lưu đơn, không thanh toán trực tuyến. <a href="#admin">Quản trị</a></small></footer>`;
$('#cn').textContent=cart.reduce((a,c)=>a+c.q,0)}
$('#q').oninput=e=>{q=e.target.value;tab='products';render()};
$('#th').onclick=()=>{if(S.set.bgc||S.set.bgi)return toast('Shop đang dùng nền tuỳ chỉnh nên giữ chế độ sáng.');const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
/* ---------- Giỏ hàng ---------- */
function add(id){const p=P(id),z=sel[id];if(!z)return toast('Hãy chọn size trước khi thêm vào giỏ.');const t=cart.filter(c=>c.id===id).reduce((a,c)=>a+c.q,0);if(t>=p.stock)return toast('Đã đạt số lượng tồn kho tối đa của sản phẩm này.');const l=cart.find(c=>c.id===id&&c.z===z);l?l.q++:cart.push({id,z,q:1});saveCart();render();toast('Đã thêm vào giỏ hàng.')}
function chg(i,d){const c=cart[i],p=P(c.id),t=cart.filter(x=>x.id===c.id).reduce((a,x)=>a+x.q,0);if(d>0&&t>=p.stock)return toast('Đã đạt giới hạn tồn kho.');c.q+=d;if(c.q<1)cart.splice(i,1);saveCart();render();drawer()}
const total=()=>cart.reduce((a,c)=>a+c.q*P(c.id).price,0);
const orderText=()=>`ĐƠN HÀNG LUNE STUDIO\nMã đơn: ${oid}\n`+cart.map(c=>{const p=P(c.id);return`- ${p.name} (size ${c.z}) x${c.q} = ${fmt(p.price*c.q)}`}).join('\n')+`\nTổng cộng: ${fmt(total())}`;
async function copy(){try{await navigator.clipboard.writeText(orderText());toast('Đã sao chép nội dung đơn hàng.');return true}catch(e){toast('Không sao chép được. Hãy bôi đen và sao chép thủ công.');return false}}
function drawer(v){if(v)dv=v;const d=$('#dr');d.hidden=$('#ov').hidden=false;let h=`<div class="ln"><h2 style="margin:0">${dv==='cart'?'Giỏ hàng':'Xác nhận đơn hàng'}</h2><button class="g" id="x">Đóng</button></div>`;
if(!cart.length)h+='<p>Giỏ hàng đang trống.</p>';else if(dv==='cart')h+=cart.map((c,i)=>{const p=P(c.id);return`<div class="ln"><div><b>${esc(p.name)}</b><br><small class="mut">Size ${c.z} · ${fmt(p.price)}</small><br>${fmt(p.price*c.q)}</div><div class="qty"><button class="g" aria-label="Giảm" onclick="chg(${i},-1)">−</button>${c.q}<button class="g" aria-label="Tăng" onclick="chg(${i},1)">+</button><button class="g" aria-label="Xoá" onclick="chg(${i},-c.q)">Xoá</button></div></div>`}).join('')+`<p><b>Tổng cộng: ${fmt(total())}</b></p><div class="row"><button class="g" onclick="copy()">Sao chép đơn hàng</button><button onclick="drawer('ck')">Tiến hành thanh toán</button></div>`;
else h+=cart.map(c=>`<div class="ln"><div>${esc(P(c.id).name)} (size ${c.z}) x${c.q}</div><div>${fmt(P(c.id).price*c.q)}</div></div>`).join('')+`<p><b>Tổng cộng: ${fmt(total())}</b></p><pre>${esc(orderText())}</pre><p class="mut">Tồn kho được cập nhật sau khi shop xác nhận đơn qua điện thoại. Website chỉ lưu đơn; thanh toán và xác nhận do shop xử lý qua Google Form và điện thoại.</p><div class="row"><button class="g" onclick="copy()">Sao chép đơn hàng</button><button class="g" onclick="drawer('cart')">Quay lại giỏ</button><button onclick="checkout()">Xác nhận và mở Google Form</button></div>`;
d.innerHTML=h;$('#x').onclick=closeAll;$('#x').focus()}
async function checkout(){const f=S.set.form;if(!FORM_OK(f))return toast('Chủ shop chưa gắn link Google Form.');const txt=orderText(),id=oid;let u=f;if(S.set.entry&&/^entry\.\d+$/.test(S.set.entry)&&f.includes('docs.google.com'))u+=(f.includes('?')?'&':'?')+S.set.entry+'='+encodeURIComponent(txt);
const items=cart.map(c=>({id:c.id,name:P(c.id).name,size:c.z,qty:c.q,price:P(c.id).price})),tot=total();
const a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();
try{await navigator.clipboard.writeText(txt)}catch(e){}
try{if(!db)throw 0;await db.collection('orders').doc(id).set({id,items,total:tot,status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()})}catch(e){toast('Chưa lưu được đơn vào hệ thống, nhưng bạn vẫn có thể điền form.')}
oid=newId();cart=[];saveCart();closeAll();render();toast('Hãy điền và nhấn Gửi trong Google Form để hoàn tất đặt hàng.')}
function detail(id){const p=P(id),m=$('#md');m.hidden=$('#ov').hidden=false;m.innerHTML=`<div class="ln"><h2 style="margin:0">${esc(p.name)}</h2><button class="g" id="x2">Đóng</button></div><div class="img" style="max-height:320px;aspect-ratio:auto;height:300px">${art(p)}</div><p><small class="mut">${esc(p.id)} · ${esc(p.sub)}</small></p><p><b>${fmt(p.price)}</b> · Tồn kho: ${p.stock} ${stk(p)}</p><p>${esc(p.desc)}</p><p class="mut">Size có sẵn: S, M, L, XL.</p>`;$('#x2').onclick=closeAll;$('#x2').focus()}
function closeAll(){$('#dr').hidden=$('#md').hidden=$('#ov').hidden=true}
$('#ov').onclick=closeAll;$('#cb').onclick=()=>drawer('cart');document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
/* ---------- Trang quản trị (#admin) ---------- */
const route=()=>{const a=location.hash==='#admin';$('#adm').hidden=!a;$('#main').hidden=a;if(a)admin();else render()};addEventListener('hashchange',route);
async function admin(){const A=$('#adm');if(!db)return A.innerHTML='<h2>Quản trị</h2><p>Chưa cấu hình Firebase trong file index.html.</p><a href="#">Về trang chủ</a>';
if(!user)return A.innerHTML=`<h2>Đăng nhập quản trị</h2><label>Số điện thoại admin<br><input id="em" type="tel" inputmode="numeric" autocomplete="username"></label><label>Mật khẩu<br><input id="pw" type="password"></label><p><button id="li">Đăng nhập</button> <a href="#">Về trang chủ</a></p>`,$('#li').onclick=()=>auth.signInWithEmailAndPassword($('#em').value.replace(/\D/g,'')+'@lunestudio.vn',$('#pw').value).catch(e=>toast('Sai số điện thoại hoặc mật khẩu.'));
try{const o=await db.collection('orders').orderBy('createdAt','desc').limit(30).get();orders=o.docs.map(d=>d.data())}catch(e){orders=[]}
const s=S.set,F=[['form','Link Google Form (https://docs.google.com/forms/… hoặc https://forms.gle/…)'],['entry','Mã ô “Đơn hàng” điền sẵn (ví dụ entry.123456, không bắt buộc)'],['phone','Số điện thoại'],['email','Email'],['addr','Địa chỉ'],['hours','Giờ làm việc'],['fb','Link Facebook'],['ig','Link Instagram'],['tt','Link TikTok']];
const tx=(k,l)=>`<label>${l}<br><input value="${esc(s[k])}" oninput="S.set['${k}']=this.value"></label>`;
$('#adm').innerHTML=`<h2>Quản trị LUNE STUDIO</h2><p><button id="sv">Lưu tất cả</button> <button class="g" onclick="auth.signOut()">Đăng xuất</button> <a href="#">Về trang chủ</a></p>
<details open><summary><b>Cài đặt shop</b></summary>${F.map(f=>tx(f[0],f[1])).join('')}<label>Ảnh banner (tuỳ chọn)<br><input type="file" accept="image/*" onchange="pick(this,d=>{S.set.banner=d})"></label><label>Màu nền trang<br><input type="color" value="${esc(s.bgc||'#f6f1e7')}" oninput="S.set.bgc=this.value;applyBg()"> <button class="g" onclick="S.set.bgc='';S.set.bgi='';applyBg();admin()">Bỏ màu/ảnh nền</button></label><label>Ảnh nền (tuỳ chọn)<br><input type="file" accept="image/*" onchange="pick(this,d=>{S.set.bgi=d;applyBg()},1280)"></label><label>Câu chuyện<textarea rows="3" oninput="S.set.story=this.value">${esc(s.story)}</textarea></label><label>Sứ mệnh<textarea rows="2" oninput="S.set.mission=this.value">${esc(s.mission)}</textarea></label><label>Tầm nhìn<textarea rows="2" oninput="S.set.vision=this.value">${esc(s.vision)}</textarea></label><label>Giá trị cốt lõi<textarea rows="2" oninput="S.set.values=this.value">${esc(s.values)}</textarea></label></details>
<details><summary><b>Thành viên (mỗi dòng: MSSV|Họ tên|Vai trò)</b></summary><textarea id="mem" rows="5">${esc(s.members.map(m=>[m.mssv,m.name,m.role].join('|')).join('\n'))}</textarea></details>
<details open><summary><b>Sản phẩm</b></summary>${S.products.map((p,i)=>`<div class="ar"><div><b>${esc(p.id)}</b> <button class="g" onclick="if(confirm('Xoá sản phẩm này?')){S.products.splice(${i},1);admin()}">Xoá</button></div><div></div>
<label>Tên<input value="${esc(p.name)}" oninput="S.products[${i}].name=this.value"></label><label>Danh mục con<input value="${esc(p.sub)}" oninput="S.products[${i}].sub=this.value"></label>
<label>Giá (VNĐ)<input type="number" value="${p.price}" oninput="S.products[${i}].price=+this.value"></label><label>Tồn kho<input type="number" value="${p.stock}" oninput="S.products[${i}].stock=+this.value"></label>
<label style="grid-column:1/-1">Mô tả<textarea rows="2" oninput="S.products[${i}].desc=this.value">${esc(p.desc)}</textarea></label>
<label><input type="checkbox" ${p.feat?'checked':''} onchange="S.products[${i}].feat=this.checked"> Nổi bật</label><label><input type="checkbox" ${p.best?'checked':''} onchange="S.products[${i}].best=this.checked"> Bán chạy</label><label><input type="checkbox" ${p.isNew?'checked':''} onchange="S.products[${i}].isNew=this.checked"> Mới</label>
<label>Ảnh thật (chọn file)<input type="file" accept="image/*" onchange="pick(this,d=>{S.products[${i}].img=d})"></label><label style="grid-column:1/-1">Hoặc dán ảnh: bấm vào ô rồi nhấn Ctrl+V<textarea rows="1" placeholder="Dán ảnh vào đây" onpaste="pasteImg(event,${i})"></textarea></label><button class="g" onclick="S.products[${i}].img='';toast('Đã bỏ ảnh thật, bấm Lưu tất cả.')">Dùng lại ảnh vẽ</button></div>`).join('')}<button onclick="S.products.push({id:'LS-'+String(S.products.length+1).padStart(3,'0'),name:'Sản phẩm mới',sub:'Áo thun',type:'tee',color:'#e9e2d3',price:100000,stock:10,desc:'',img:'',feat:false,best:false,isNew:true});admin()">Thêm sản phẩm</button></details>
<details><summary><b>Danh mục (mỗi dòng: Tên cấp 1: con1, con2)</b></summary><textarea id="cat" rows="4">${esc(S.cats.map(c=>c.n+': '+c.s.join(', ')).join('\n'))}</textarea></details>
<details><summary><b>Bộ sưu tập (mỗi dòng: Tên: LS-001,LS-002)</b></summary><textarea id="col" rows="4">${esc(S.cols.map(c=>c.n+': '+c.ids.join(',')).join('\n'))}</textarea></details>
<details><summary><b>Phản hồi (mỗi dòng: Tên|số sao|ngày|nội dung|mau hoặc thật)</b></summary><textarea id="rvs" rows="8">${esc(S.reviews.map(r=>[r.n,r.s,r.d,r.t,r.sample?'mau':'that'].join('|')).join('\n'))}</textarea></details>
<details open><summary><b>Đơn hàng gần đây</b></summary>${orders.length?orders.map(o=>`<div class="ln"><div><b>${esc(o.id)}</b> · ${esc(o.status)}<br><small>${(o.items||[]).map(i=>esc(i.name)+' ('+esc(i.size)+') x'+i.qty).join('; ')}</small><br>${fmt(o.total)}</div>${o.status==='pending'?`<button onclick="okOrder('${esc(o.id)}')">Đã gọi xác nhận, trừ tồn</button>`:''}</div>`).join(''):'<p>Chưa có đơn hàng.</p>'}</details>`;
$('#sv').onclick=()=>{S.set.members=$('#mem').value.split('\n').filter(x=>x.trim()).map(l=>{const a=l.split('|');return{mssv:a[0]||'',name:a[1]||'',role:a[2]||''}});
S.cats=$('#cat').value.split('\n').filter(x=>x.includes(':')).map(l=>({n:l.split(':')[0].trim(),s:l.split(':')[1].split(',').map(x=>x.trim()).filter(Boolean)}));
S.cols=$('#col').value.split('\n').filter(x=>x.includes(':')).map(l=>({n:l.split(':')[0].trim(),ids:l.split(':')[1].split(',').map(x=>x.trim()).filter(Boolean)}));
S.reviews=$('#rvs').value.split('\n').filter(x=>x.trim()).map(l=>{const a=l.split('|');return{n:a[0],s:Math.min(5,Math.max(1,+a[1]||5)),d:a[2]||'',t:a[3]||'',sample:(a[4]||'').trim()!=='that'}});save()}}
function applyBg(){const t=S.set,b=document.body;if(t.bgc||t.bgi){document.documentElement.dataset.theme='light';b.style.background=(t.bgi?`url("${t.bgi}") center/cover fixed `:'')+(t.bgc||'')}else b.style.background=''}
function pasteImg(e,i){const f=[...e.clipboardData.items].find(x=>x.type.startsWith('image/'));if(!f)return toast('Không thấy ảnh trong clipboard.');e.preventDefault();pick({files:[f.getAsFile()]},d=>{S.products[i].img=d})}
function pick(inp,cb,max){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,(max||640)/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75));toast('Đã chọn ảnh. Bấm “Lưu tất cả” để áp dụng.')};im.src=r.result};r.readAsDataURL(f)}
async function okOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;o.items.forEach(i=>{const p=P(i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)});try{await db.collection('orders').doc(id).update({status:'confirmed'});await save();admin()}catch(e){toast('Lỗi: '+e.message)}}
load();
</script>
</body>
</html>
