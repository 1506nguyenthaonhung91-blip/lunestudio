<div><h2>Khách hàng nói gì</h2>${fbList(S.feedbacks.slice(0,3))}${sampleNote()}</div>`},

function compress(file,cb,mx){mx=mx||1600;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{let k=Math.min(1,mx/Math.max(im.width,im.height)),u='';const LIM=800000;for(let t=0;t<8;t++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.92);if(u.length<=LIM)break;k*=.85}cb(u)};im.onerror=()=>toast('Không đọc được ảnh');im.src=r.result};r.readAsDataURL(file)}

function thumb(u){return new Promise(r=>{if(!u||u.slice(0,5)!=='data:')return r(u||'');const im=new Image();im.onload=()=>{const k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.82))};im.onerror=()=>r('');im.src=u})}
/* Ảnh đầy đủ lưu thành từng tài liệu riêng trong products (id = sp__slot_i); tài liệu sản phẩm chỉ giữ ảnh nhỏ để trang chủ tải nhanh */
function full(p){if(p._full!==false||!db)return Promise.resolve();return db.collection('products').where('imgOf','==',p.id).get().then(s=>{const g=[],cs={};s.docs.forEach(x=>{const o=x.data();if(o.slot==='g')g[o.i]=o.d;else(cs[o.slot]=cs[o.slot]||[])[o.i]=o.d});const gg=g.filter(Boolean);if(gg.length){p.imgs=gg;p.img=gg[0]}(p.colors||[]).forEach((c,x)=>{const a=(cs['c'+x]||[]).filter(Boolean);if(a.length)c.imgs=a});p._full=true}).catch(()=>{})}
async function pack(p){const ch=[],add=(slot,arr)=>(arr||[]).forEach((d,i)=>ch.push({id:p.id+'__'+slot+'_'+i,imgOf:p.id,slot,i,d}));add('g',p.imgs);(p.colors||[]).forEach((c,x)=>add('c'+x,c.imgs));
const doc=JSON.parse(JSON.stringify(p));delete doc.id;delete doc._full;delete doc._ch;
doc.imgs=(p.imgs||[]).length?[await thumb(p.imgs[0])]:[];doc.img=doc.imgs[0]||'';
doc.colors=await Promise.all((p.colors||[]).map(async c=>({name:c.name,hex:c.hex,imgs:(c.imgs||[]).length?[await thumb(c.imgs[0])]:[]})));doc.lz=1;return{doc,ch}}
async function wrChunks(pid,ch){const old=await db.collection('products').where('imgOf','==',pid).get(),keep=new Set(ch.map(c=>c.id));let b=db.batch(),n=0;const flush=async()=>{if(n){await b.commit();b=db.batch();n=0}};
for(const d of old.docs){if(!keep.has(d.id)){b.delete(d.ref);n++}}await flush();
for(const c of ch){const x={...c};delete x.id;b.set(db.collection('products').doc(c.id),x);if(++n>=5)await flush()}await flush()}
function save(){if(!FB||!db)return toast('Chưa kết nối Firebase nên chưa lưu được');if(saving)return;saving=true;toast('Đang lưu, ảnh chất lượng cao nên có thể mất vài giây…');doSave().catch(e=>toast('Lưu thất bại: '+(e&&e.code==='permission-denied'?'bạn không có quyền ghi':'hãy kiểm tra mạng và thử lại'))).then(()=>{saving=false})}

if(!OKURL(S.formUrl)||!OKURL(S.fbUrl))return toast('Link Google Form chưa đúng định dạng');
const d=JSON.parse(JSON.stringify(S));delete d.products;d.split=true;const n=JSON.stringify(d).length;if(n>950000)return toast('Phần banner và nội dung chung quá lớn ('+Math.round(n/1000)+' KB, tối đa khoảng 950 KB). Hãy dùng ảnh banner nhỏ hơn.');
const out=[];for(const p of S.products){let doc,ch=null;if(p._full===false){doc=JSON.parse(JSON.stringify(p));delete doc.id;delete doc._full;delete doc._ch}else{const r=await pack(p);doc=r.doc;if(!p.lz||p._ch)ch=r.ch}
if(JSON.stringify(doc).length>950000)return toast('Sản phẩm "'+p.name+'" quá lớn, hãy bớt màu hoặc xoá bớt ảnh.');if(ch&&ch.some(c=>c.d.length>1000000))return toast('Có ảnh của "'+p.name+'" quá nặng, hãy chọn ảnh khác.');out.push({p,doc,ch})}

function loadProducts(){return db.collection('products').orderBy('ord').get().then(ps=>{PIDS=ps.docs.map(x=>x.id);if(ps.size||S.split)S.products=ps.docs.map(x=>({id:x.id,...x.data(),_full:!x.data().lz})).sort((a,b)=>(a.ord||0)-(b.ord||0))})}
function confirmOrder(id){const oref=db.collection('orders').doc(id),sref=db.collection('shop').doc('data');
db.runTransaction(async t=>{const o=await t.get(oref),sh=await t.get(sref);if(!o.exists||o.data().status!=='pending')throw new Error('Đơn này đã được xử lý');if(!sh.exists||!sh.data().split)throw new Error('Hãy bấm "Lưu thay đổi" một lần để chuyển sản phẩm sang kiểu lưu mới');const need={};(o.data().items||[]).forEach(it=>{need[it.id]=(need[it.id]||0)+it.qty});const rs=await Promise.all(Object.keys(need).map(pid=>t.get(db.collection('products').doc(pid))));rs.forEach(r=>{if(r.exists&&r.data().stock<need[r.id])throw new Error('Không đủ hàng: '+r.data().name+' (còn '+r.data().stock+')')});rs.forEach(r=>{if(r.exists)t.update(r.ref,{stock:r.data().stock-need[r.id]})});t.update(oref,{status:'confirmed'})})
.then(()=>loadProducts()).then(()=>{toast('Đã xác nhận đơn và trừ kho');render();loadOrders()}).catch(e=>toast(e.message||'Không xác nhận được đơn'))}
/* ===== Sự kiện ===== */
const A={
tab(e){tab=e.dataset.t;render();window.scrollTo(0,0)},
size(e){sel[e.dataset.id]=e.dataset.s;render()},
add(e){const id=e.dataset.id;add(id,sel[id],selc[id])},
ccol(e){selc[e.dataset.id]=e.dataset.c;render()},
view(e){detail(e.dataset.id,0)},
gimg(e){gshow(+e.dataset.i)},gprev(){gshow(dv.i-1)},gnext(){gshow(dv.i+1)},
pcol(e){selc[e.dataset.id]=e.dataset.c;e.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===e));$('#dcn').textContent=e.dataset.c;dv.i=0;paintGal();render()},
ac(){if(tmpCols.length>=8)return toast('Tối đa 8 màu');tmpCols.push({name:'',hex:'#000000',imgs:[]});drawCols()},
rc(e){tmpCols.splice(+e.dataset.x,1);drawCols()},
rci(e){tmpCols[+e.dataset.x].imgs.splice(+e.dataset.j,1);drawCols()},
dqm(){if(dv.q>1)dv.q--;$('#qv').textContent=dv.q},dqp(){const p=prod(dv.id);if(dv.q<p.stock)dv.q++;$('#qv').textContent=dv.q},
dadd(){add(dv.id,sel[dv.id],selc[dv.id],dv.q)},
rmi(e){tmpImgs.splice(+e.dataset.i,1);drawImgs()},
size2(e){sel[e.dataset.id]=e.dataset.s;e.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===e))},
cart(){closeModal();openDrawer('cart')},close:closeAll,co:checkout,
inc(e){const i=cart[+e.dataset.x],p=prod(i.id);if(qtyOf(i.id)+1>p.stock)return toast('Đã đạt giới hạn tồn kho ('+p.stock+')');i.qty++;svCart();render()},
dec(e){const i=cart[+e.dataset.x];i.qty--;if(i.qty<=0)cart.splice(+e.dataset.x,1);svCart();render()},
rm(e){cart.splice(+e.dataset.x,1);svCart();render();toast('Đã xoá khỏi giỏ hàng')},
copy(){copyText($('#ot').value).then(()=>toast('Đã sao chép đơn hàng'))},go,
copyl(){copyText(lastOrder).then(()=>toast('Đã sao chép đơn hàng'))},
reopen(){if(S.formUrl)window.open(formLink(lastOrder),'_blank','noopener,noreferrer')},
fc(e){fc=e.dataset.c;fs='';render()},fs(e){fs=fs===e.dataset.c?'':e.dataset.c;render()},
login,dologin,fsave,sapply,aad,
logout(){auth.signOut().then(()=>{guest=false;toast('Đã đăng xuất')})},
guest(){guest=!guest;render()},save,set(){openDrawer('set')},
eb(){form('Sửa banner',[{k:'title',l:'Tiêu đề banner',t:'text'},{k:'lead',l:'Mô tả ngắn',t:'area'},{k:'btn',l:'Chữ trên nút',t:'text'},{k:'img',l:'Ảnh banner (chọn file, tự nén)',t:'img'},{k:'rmimg',l:'Ảnh banner hiện tại',t:'chk',o:[['1','Xoá ảnh, dùng hình vẽ mặc định']]}],{title:S.theme.title||'',lead:S.lead,btn:S.theme.btn||'',img:S.theme.banner||'',rmimg:[]},v=>{if(v.title.length>80)return 'Tiêu đề tối đa 80 ký tự';S.theme.title=v.title;S.lead=v.lead;S.theme.btn=v.btn;S.theme.banner=v.rmimg.length?'':v.img;toast('Đã sửa banner, nhớ bấm "Lưu thay đổi"')})},
rp(e){const f=e.dataset.f;form('Trả lời bình luận',[{k:'name',l:'Tên của bạn',t:'text'},{k:'text',l:'Nội dung trả lời (viết tiếng Việt, tối đa 500 ký tự)',t:'area'}],{},v=>{if(v.name.length<2||v.name.length>60)return 'Tên cần từ 2 đến 60 ký tự';if(v.text.length<2||v.text.length>500)return 'Nội dung cần từ 2 đến 500 ký tự';if(Date.now()-lastRp<15000)return 'Bạn vừa gửi, hãy đợi vài giây rồi thử lại';lastRp=Date.now();const r={fid:f,name:v.name,text:v.text,date:new Date().toLocaleDateString('vi-VN'),ts:Date.now()};if(FB&&db){db.collection('replies').add(r).then(d=>{r.id=d.id;R.push(r);render();toast('Đã đăng trả lời')}).catch(()=>toast('Chưa gửi được trả lời, hãy thử lại'));return}r.id='local_'+Date.now();R.push(r);toast('Chưa kết nối Firebase nên trả lời chỉ hiện đến khi tải lại trang')})},
dr(e){const id=e.dataset.r,done=()=>{R=R.filter(r=>r.id!==id);render();toast('Đã xoá trả lời')};FB&&db&&!id.startsWith('local_')?db.collection('replies').doc(id).delete().then(done).catch(()=>toast('Không xoá được')):done()},
rev(e){db.collection('admins').doc(e.dataset.e).delete().then(()=>{toast('Đã thu hồi quyền');loadAdmins()}).catch(()=>toast('Không thu hồi được'))},
oc(e){confirmOrder(e.dataset.o)},
ox(e){db.collection('orders').doc(e.dataset.o).update({status:'cancelled'}).then(()=>{toast('Đã huỷ đơn');loadOrders()}).catch(()=>toast('Không huỷ được đơn'))},
ap(){pForm('Thêm sản phẩm',{cat:Object.keys(S.cats)[0],sub:(S.cats[Object.keys(S.cats)[0]]||[])[0],k:'tee',flags:[],price:0,stock:0},v=>{S.products.push({id:'p'+Date.now(),...v});toast('Đã thêm, nhớ bấm "Lưu thay đổi"')})},
ep(e){const p=prod(e.dataset.id);full(p).then(()=>{if(p._full===false)return toast('Chưa tải được ảnh sản phẩm, hãy thử lại');pForm('Sửa sản phẩm',p,v=>{const bf=JSON.stringify([p.imgs,(p.colors||[]).map(c=>c.imgs)]);Object.assign(p,v);if(bf!==JSON.stringify([p.imgs,(p.colors||[]).map(c=>c.imgs)]))p._ch=1;toast('Đã sửa, nhớ bấm "Lưu thay đổi"')})})},
dp(e){if(!confirm('Xoá sản phẩm này?'))return;S.products=S.products.filter(p=>p.id!==e.dataset.id);cart=cart.filter(i=>i.id!==e.dataset.id);svCart();render()},
am(){form('Thêm thành viên',[{k:'mssv',l:'MSSV',t:'text'},{k:'name',l:'Họ và tên',t:'text'},{k:'role',l:'Vai trò',t:'text'}],{},v=>{S.members.push(v)})},
em(e){const m=S.members[+e.dataset.i];form('Sửa thành viên',[{k:'mssv',l:'MSSV',t:'text'},{k:'name',l:'Họ và tên',t:'text'},{k:'role',l:'Vai trò',t:'text'}],m,v=>{Object.assign(m,v)})},
dm(e){S.members.splice(+e.dataset.i,1);render()},
af(){form('Thêm phản hồi thật của khách',[{k:'name',l:'Tên khách hàng',t:'text'},{k:'text',l:'Nội dung (tiếng Việt)',t:'area'},{k:'stars',l:'Số sao (1 đến 5)',t:'number'},{k:'date',l:'Ngày',t:'text'}],{stars:5},v=>{if(!v.name||!v.text)return 'Hãy nhập tên và nội dung';if(!(v.stars>=1&&v.stars<=5))return 'Số sao phải từ 1 đến 5';S.feedbacks.unshift({...v,stars:Math.round(v.stars),sample:false,id:'f'+Date.now().toString(36)})})},
df(e){S.feedbacks.splice(+e.dataset.i,1);render()},
el(){form('Giới thiệu và giao diện',[{k:'lead',l:'Câu giới thiệu đầu trang',t:'area'},{k:'about',l:'Nội dung trang Về chúng tôi',t:'area'},{k:'bg',l:'Màu nền (dạng #f6f1ea, để trống = mặc định)',t:'text'}],{lead:S.lead,about:S.about,bg:S.theme.bg},v=>{if(v.bg&&!/^#[0-9a-f]{6}$/i.test(v.bg))return 'Màu nền phải có dạng #aabbcc';S.lead=v.lead;S.about=v.about;S.theme.bg=v.bg})}
};
document.addEventListener('click',ev=>{const m=$('#modal');if(ev.target===m)return closeModal();const e=ev.target.closest('[data-act]');if(e&&A[e.dataset.act])A[e.dataset.act](e)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(mode)closeAll()}
const t=ev.target.closest&&ev.target.closest('[role=tab]');if(t&&['ArrowRight','ArrowLeft','Home','End'].includes(ev.key)){ev.preventDefault();const i=TABS.findIndex(x=>x[0]===tab),n=ev.key==='Home'?0:ev.key==='End'?TABS.length-1:(i+(ev.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;tab=TABS[n][0];render();$('#tb-'+tab).focus()}});
document.addEventListener('input',ev=>{const t=ev.target,r=t.closest&&t.closest('.cr');if(!r)return;const c=tmpCols[+r.dataset.x];if(!c)return;if(t.classList.contains('cx'))c.hex=t.value;else if(t.classList.contains('cn'))c.name=t.value});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.classList||!t.classList.contains('cf'))return;const r=t.closest('.cr'),c=tmpCols[+r.dataset.x];if(!c)return;[...t.files].forEach(fl=>{if(c.imgs.length>=8)return toast('Tối đa 8 ảnh cho mỗi màu');compress(fl,d=>{if(c.imgs.length<8){c.imgs.push(d);drawCols()}})});t.value=''});
$('#q').addEventListener('input',()=>{if($('#q').value&&tab!=='products')tab='products';render()});
$('#tg').addEventListener('click',()=>{dark=!dark;render()});
render();
if(FB){try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();auth=firebase.auth();
db.collection('replies').get().then(s=>{R=s.docs.map(d=>({id:d.id,...d.data()}));render()}).catch(()=>{});
db.collection('shop').doc('data').get().then(d=>{if(d.exists){S=Object.assign(JSON.parse(JSON.stringify(DEF)),d.data());S.contact=Object.assign({},DEF.contact,S.contact);S.theme=Object.assign({},DEF.theme,S.theme)}}).then(()=>loadProducts()).then(()=>render()).catch(()=>render());
auth.onAuthStateChanged(u=>{if(!u){isAd=false;me='';guest=false;render();return}me=u.email;db.collection('admins').doc(u.email).get().then(d=>{isAd=d.exists;if(!isAd){toast('Tài khoản này không có quyền quản trị');auth.signOut();return}guest=false;render();loadAdmins()}).catch(()=>{isAd=false;render()})})}catch(e){}}
</script>
